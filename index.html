<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --plus: #16a34a;
    --minus: #dc2626;
    --border: #e2e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316;
      --card: #1c1f24;
      --text: #f1f2f4;
      --muted: #9aa1ad;
      --accent: #60a5fa;
      --plus: #4ade80;
      --minus: #f87171;
      --border: #2c3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 16px; font-size: 1.75rem; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=text] {
    flex: 1; min-width: 0;
    padding: 12px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
  }
  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text);
    padding: 10px 14px;
    touch-action: manipulation;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas: "name score" "controls controls";
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  li.leader { border-color: var(--accent); }
  .name { grid-area: name; font-weight: 600; font-size: 1.15rem; word-break: break-word; align-self: center; }
  .score { grid-area: score; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .controls { grid-area: controls; display: flex; gap: 8px; flex-wrap: wrap; }
  .controls button { flex: 1; min-width: 52px; font-weight: 600; font-size: 1.05rem; }
  .controls .plus { color: var(--plus); }
  .controls .minus { color: var(--minus); }
  .controls .del { flex: 0 0 auto; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .footer button { font-size: .9rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Scoreboard</h1>

  <form id="add-form">
    <input id="team-name" type="text" placeholder="Team name" maxlength="40" autocomplete="off" required>
    <button class="primary" type="submit">Add</button>
  </form>

  <ul id="teams"></ul>
  <p id="empty" class="empty">No teams yet. Add one above.</p>

  <div class="footer">
    <button id="reset-scores" type="button">Reset scores</button>
    <button id="clear-all" type="button">Remove all teams</button>
  </div>
</main>

<script>
  const STORAGE_KEY = 'scoreboard.teams';
  const list = document.getElementById('teams');
  const empty = document.getElementById('empty');
  const form = document.getElementById('add-form');
  const nameInput = document.getElementById('team-name');

  let teams = load();

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(teams));
    } catch {
      // Storage unavailable (e.g. private mode); scores still work until refresh.
    }
  }

  function render() {
    list.innerHTML = '';
    empty.hidden = teams.length > 0;
    const top = Math.max(...teams.map(t => t.score));

    for (const team of teams) {
      const li = document.createElement('li');
      if (teams.length > 1 && team.score === top && top > 0) li.classList.add('leader');

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = team.name;

      const score = document.createElement('div');
      score.className = 'score';
      score.textContent = team.score;

      const controls = document.createElement('div');
      controls.className = 'controls';
      for (const [label, delta, cls] of [['−1', -1, 'minus'], ['+1', 1, 'plus'], ['+5', 5, 'plus']]) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = cls;
        b.textContent = label;
        b.onclick = () => { team.score += delta; save(); render(); };
        controls.append(b);
      }
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = 'Remove';
      del.onclick = () => {
        if (!confirm(`Remove ${team.name}?`)) return;
        teams = teams.filter(t => t !== team);
        save(); render();
      };
      controls.append(del);

      li.append(name, score, controls);
      list.append(li);
    }
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    teams.push({ id: Date.now(), name, score: 0 });
    nameInput.value = '';
    save(); render();
  });

  document.getElementById('reset-scores').onclick = () => {
    if (!teams.length || !confirm('Set every score back to 0?')) return;
    teams.forEach(t => t.score = 0);
    save(); render();
  };

  document.getElementById('clear-all').onclick = () => {
    if (!teams.length || !confirm('Remove all teams?')) return;
    teams = [];
    save(); render();
  };

  // Keep multiple open tabs in sync.
  window.addEventListener('storage', e => {
    if (e.key === STORAGE_KEY) { teams = load(); render(); }
  });

  render();
</script>
</body>
</html>
